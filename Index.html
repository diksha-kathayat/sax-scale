<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Today Slider</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #6741d9;
    --purple-dark: #2d2a6e;
    --purple-soft: #f1edff;
    --text: #3d3d4e;
    --muted: #8a8aa0;
    --tick: #b9b4d6;
    --track: #e6e2f5;
    --bg: #f7f8fa;
    --card: #ffffff;
    --ok: #1fa35b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Poppins", system-ui, sans-serif;
  }
  .card {
    max-width: 760px; margin: 24px auto; background: var(--card);
    border-radius: 12px; padding: 24px 28px 36px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  h1 { font-size: 20px; color: var(--purple-dark); margin: 0 0 8px; font-weight: 600; }
  h1 .req { color: #e03131; font-size: 14px; vertical-align: super; }
  .intro p { margin: 4px 0; font-size: 15px; }

  .layout {
    display: flex; gap: 48px; margin-top: 32px; align-items: flex-start;
    justify-content: center; flex-wrap: wrap;
  }
  .valuebox { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .value {
    width: 130px; padding: 18px 8px 14px; border-radius: 14px;
    background: var(--purple-soft); text-align: center;
  }
  .value .num { font-size: 46px; font-weight: 800; color: var(--purple); line-height: 1; }
  .value .lbl { font-size: 12px; font-weight: 600; color: var(--purple); margin-top: 8px; letter-spacing: .3px; }
  .actions { display: flex; gap: 8px; }
  .btn {
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--purple); background: #fff; color: var(--purple);
    border-radius: 8px; padding: 6px 14px;
  }
  .btn:hover:not(:disabled) { background: var(--purple-soft); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--purple); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #5532c4; }
  .toast { font-size: 13px; color: var(--ok); height: 18px; }

  /* Scale */
  .scale { display: flex; gap: 14px; user-select: none; touch-action: none; }
  .labels, .ticks, .anchors { position: relative; height: 420px; }
  .labels { width: 32px; }
  .labels span {
    position: absolute; right: 0; transform: translateY(-50%);
    font-size: 14px; color: var(--text);
  }
  .labels span.major { font-weight: 600; }
  .rail { position: relative; width: 44px; height: 420px; cursor: pointer; }
  .rail .track {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 6px;
    transform: translateX(-50%); background: var(--track); border-radius: 3px;
  }
  .rail .fill {
    position: absolute; left: 50%; bottom: 0; width: 6px;
    transform: translateX(-50%); background: var(--purple); border-radius: 3px;
    height: 0;
  }
  .rail .tick {
    position: absolute; left: 50%; height: 1px; background: var(--tick);
    transform: translate(-50%, -50%);
  }
  .rail .tick.t1 { width: 12px; }
  .rail .tick.t5 { width: 20px; }
  .rail .tick.t10 { width: 30px; height: 2px; background: var(--purple-dark); }
  .thumb {
    position: absolute; left: 50%; width: 28px; height: 28px; border-radius: 50%;
    background: #fff; border: 3px solid var(--purple);
    transform: translate(-50%, 50%); bottom: 0; cursor: grab;
    box-shadow: 0 1px 4px rgba(0,0,0,.15); outline: none;
  }
  .thumb:focus-visible { box-shadow: 0 0 0 4px rgba(103,65,217,.3); }
  .thumb.hidden { display: none; }
  .rail.dragging .thumb { cursor: grabbing; }
  .anchors { width: 210px; }
  .anchors span {
    position: absolute; left: 0; transform: translateY(-50%);
    font-size: 14px; color: var(--text);
  }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }

  @media (max-width: 560px) {
    .card { margin: 0; border-radius: 0; padding: 20px 16px 28px; }
    .layout { gap: 28px; }
    .anchors { width: 120px; }
    .anchors span { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="layout" style="margin-top:8px">
    <div class="valuebox">
      <div class="value" aria-live="polite">
        <div class="num" id="num">–</div>
        <div class="lbl">YOUR HEALTH<br>TODAY</div>
      </div>
      <div class="actions">
        <button class="btn" id="resetBtn" disabled>Reset</button>
        <button class="btn primary" id="copyBtn" disabled>Copy</button>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="scale">
      <div class="labels" id="labels"></div>
      <div class="rail" id="rail">
        <div class="track"></div>
        <div class="fill" id="fill"></div>
        <div class="thumb hidden" id="thumb" tabindex="0" role="slider"
             aria-label="Your health today" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
      <div class="anchors">
        <span style="top:0">The best health you can imagine</span>
        <span style="top:100%">The worst health you can imagine</span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const MIN = 0, MAX = 100;
  const rail = document.getElementById('rail');
  const fill = document.getElementById('fill');
  const thumb = document.getElementById('thumb');
  const num = document.getElementById('num');
  const labels = document.getElementById('labels');
  const resetBtn = document.getElementById('resetBtn');
  const copyBtn = document.getElementById('copyBtn');
  const toast = document.getElementById('toast');
  let value = null;

  const pct = v => ((v - MIN) / (MAX - MIN)) * 100;

  // Ticks every 1, medium every 5, major + label every 10
  for (let v = MIN; v <= MAX; v++) {
    const t = document.createElement('div');
    t.className = 'tick ' + (v % 10 === 0 ? 't10' : v % 5 === 0 ? 't5' : 't1');
    t.style.top = (100 - pct(v)) + '%';
    rail.insertBefore(t, fill);
    if (v % 10 === 0) {
      const s = document.createElement('span');
      s.textContent = v;
      s.className = 'major';
      s.style.top = (100 - pct(v)) + '%';
      labels.appendChild(s);
    }
  }

  function setValue(v) {
    value = v == null ? null : Math.max(MIN, Math.min(MAX, Math.round(v)));
    if (value == null) {
      num.textContent = '–';
      fill.style.height = '0';
      thumb.classList.add('hidden');
      thumb.removeAttribute('aria-valuenow');
    } else {
      num.textContent = value;
      fill.style.height = pct(value) + '%';
      thumb.style.bottom = pct(value) + '%';
      thumb.classList.remove('hidden');
      thumb.setAttribute('aria-valuenow', value);
    }
    resetBtn.disabled = copyBtn.disabled = value == null;
  }

  function fromPointer(e) {
    const r = rail.getBoundingClientRect();
    const ratio = 1 - (e.clientY - r.top) / r.height;
    setValue(MIN + ratio * (MAX - MIN));
  }

  rail.addEventListener('pointerdown', e => {
    rail.setPointerCapture(e.pointerId);
    rail.classList.add('dragging');
    fromPointer(e);
    thumb.focus({ preventScroll: true });
  });
  rail.addEventListener('pointermove', e => {
    if (rail.hasPointerCapture(e.pointerId)) fromPointer(e);
  });
  const end = e => { rail.classList.remove('dragging'); };
  rail.addEventListener('pointerup', end);
  rail.addEventListener('pointercancel', end);

  thumb.addEventListener('keydown', e => {
    const cur = value ?? 50;
    const map = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 10, PageDown: -10 };
    if (e.key in map) { setValue(cur + map[e.key]); e.preventDefault(); }
    else if (e.key === 'Home') { setValue(MIN); e.preventDefault(); }
    else if (e.key === 'End') { setValue(MAX); e.preventDefault(); }
  });

  resetBtn.addEventListener('click', () => { setValue(null); flash(''); });

  function flash(msg) {
    toast.textContent = msg;
    clearTimeout(flash.t);
    if (msg) flash.t = setTimeout(() => (toast.textContent = ''), 1800);
  }

  copyBtn.addEventListener('click', async () => {
    if (value == null) return;
    const text = String(value);
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
    flash('Copied ' + text + ' ✓');
  });

  setValue(null);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Health Today</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px;
  font-family: 'Poppins', sans-serif;
  background: #ffffff;
  color: #25213b;
}

.health-widget {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

/* Vertical slider */
.scale {
  position: relative;
  width: 100%;
  max-width: 280px;
  height: 420px;
  margin: 0 auto;
  padding: 0 35px;
  touch-action: none;
  user-select: none;
}

.rail {
  position: absolute;
  top: 8px;
  bottom: 8px;
  left: 50%;
  width: 8px;
  transform: translateX(-50%);
  border-radius: 20px;
  background: #e8e1ff;
}

.progress {
  position: absolute;
  bottom: 8px;
  left: 50%;
  width: 8px;
  height: 0;
  transform: translateX(-50%);
  border-radius: 20px;
  background: #7651e8;
  pointer-events: none;
}

.ticks {
  position: absolute;
  inset: 0;
}

.tick {
  position: absolute;
  left: 50%;
  width: 12px;
  height: 2px;
  transform: translateX(-50%);
  background: #b9a9ef;
  pointer-events: none;
}

.tick.major {
  width: 20px;
  height: 3px;
  background: #8c73d9;
}

.tick-label {
  position: absolute;
  left: calc(50% + 24px);
  transform: translateY(50%);
  color: #77718c;
  font-size: 11px;
  font-weight: 500;
  line-height: 1;
  pointer-events: none;
}

.thumb {
  position: absolute;
  left: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, 50%);
  border: 4px solid #ffffff;
  border-radius: 50%;
  background: #7651e8;
  box-shadow: 0 2px 10px rgba(75, 45, 160, 0.28);
  cursor: grab;
  z-index: 2;
}

.thumb:active {
  cursor: grabbing;
}

.thumb:focus-visible {
  outline: 3px solid #bcaaff;
  outline-offset: 4px;
}

/* Purple result patch */
.valuebox {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
}

.value {
  display: inline-flex;
  flex: 0 1 auto;
  align-items: center;
  justify-content: center;
  gap: 14px;
  width: fit-content;
  max-width: 100%;
  min-width: 0;
  padding: 16px 22px;
  border-radius: 16px;
  background: #7651e8;
  color: #ffffff;
  box-shadow: 0 8px 22px rgba(91, 62, 180, 0.18);
}

.number {
  flex: 0 0 auto;
  font-size: 36px;
  font-weight: 700;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.value-label {
  min-width: 0;
  max-width: 150px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: 0.7px;
  white-space: normal;
  overflow-wrap: break-word;
}

.actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  width: 100%;
}

.btn {
  min-width: 112px;
  padding: 11px 20px;
  border: 1px solid #7651e8;
  border-radius: 10px;
  background: #ffffff;
  color: #6844d5;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}

.btn.primary {
  background: #7651e8;
  color: #ffffff;
}

.btn:hover {
  background: #f2eeff;
}

.btn.primary:hover {
  background: #6340d0;
}

.btn:focus-visible {
  outline: 3px solid #c9baff;
  outline-offset: 3px;
}

.toast {
  min-height: 18px;
  color: #5e4a9d;
  font-size: 12px;
  text-align: center;
}

/* Smaller screens */
@media (max-width: 360px) {
  body {
    padding: 18px 12px;
  }

  .scale {
    height: 340px;
  }

  .value {
    gap: 10px;
    padding: 14px 16px;
  }

  .number {
    font-size: 32px;
  }

  .value-label {
    max-width: 125px;
    font-size: 12px;
  }

  .btn {
    min-width: 100px;
    padding: 10px 14px;
  }
}
</style>
</head>

<body>
<div class="health-widget">

  <div
    class="scale"
    id="healthScale"
    role="slider"
    tabindex="0"
    aria-label="Your Health Today"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="50"
  >
    <div class="rail"></div>
    <div class="progress" id="progress"></div>
    <div class="ticks" id="ticks"></div>
    <div class="thumb" id="thumb"></div>
  </div>

  <div class="valuebox">
    <div class="value">
      <div class="number" id="num">50</div>
      <div class="value-label">YOUR HEALTH<br>TODAY</div>
    </div>

    <div class="actions">
      <button class="btn" id="resetBtn" type="button">Reset</button>
      <button class="btn primary" id="copyBtn" type="button">Copy</button>
    </div>

    <div class="toast" id="toast" aria-live="polite"></div>
  </div>

</div>

<script>
(function () {
  const scale = document.getElementById('healthScale');
  const ticks = document.getElementById('ticks');
  const thumb = document.getElementById('thumb');
  const progress = document.getElementById('progress');
  const num = document.getElementById('num');
  const toast = document.getElementById('toast');
  const resetBtn = document.getElementById('resetBtn');
  const copyBtn = document.getElementById('copyBtn');

  let value = 50;
  let dragging = false;

  // Create tick marks from 0 to 100, with labels every 10.
  for (let i = 0; i <= 100; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 10 === 0 ? ' major' : '');
    tick.style.bottom = `calc(8px + (100% - 16px) * ${i / 100})`;
    ticks.appendChild(tick);

    if (i % 10 === 0) {
      const label = document.createElement('div');
      label.className = 'tick-label';
      label.textContent = i;
      label.style.bottom = `calc(8px + (100% - 16px) * ${i / 100})`;
      ticks.appendChild(label);
    }
  }

  function render() {
    const percentage = value;
    thumb.style.bottom = `calc(8px + (100% - 16px) * ${percentage / 100})`;
    progress.style.height = `calc((100% - 16px) * ${percentage / 100})`;
    num.textContent = value;
    scale.setAttribute('aria-valuenow', value);
  }

  function setValueFromPointer(event) {
    const rect = scale.getBoundingClientRect();
    const usableHeight = rect.height - 16;
    const y = event.clientY - rect.top - 8;
    const percentage = 100 - (y / usableHeight) * 100;
    value = Math.max(0, Math.min(100, Math.round(percentage)));
    render();
  }

  scale.addEventListener('pointerdown', function (event) {
    dragging = true;
    scale.setPointerCapture(event.pointerId);
    setValueFromPointer(event);
  });

  scale.addEventListener('pointermove', function (event) {
    if (dragging) setValueFromPointer(event);
  });

  scale.addEventListener('pointerup', function () {
    dragging = false;
  });

  scale.addEventListener('pointercancel', function () {
    dragging = false;
  });

  scale.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowUp' || event.key === 'ArrowRight') {
      event.preventDefault();
      value = Math.min(100, value + 1);
    } else if (event.key === 'ArrowDown' || event.key === 'ArrowLeft') {
      event.preventDefault();
      value = Math.max(0, value - 1);
    } else if (event.key === 'PageUp') {
      event.preventDefault();
      value = Math.min(100, value + 10);
    } else if (event.key === 'PageDown') {
      event.preventDefault();
      value = Math.max(0, value - 10);
    } else if (event.key === 'Home') {
      event.preventDefault();
      value = 0;
    } else if (event.key === 'End') {
      event.preventDefault();
      value = 100;
    } else {
      return;
    }

    render();
  });

  resetBtn.addEventListener('click', function () {
    value = 50;
    toast.textContent = '';
    render();
  });

  copyBtn.addEventListener('click', async function () {
    const text = 'YOUR HEALTH TODAY: ' + value;

    try {
      await navigator.clipboard.writeText(text);
      toast.textContent = 'Copied to clipboard!';
    } catch (error) {
      const temp = document.createElement('textarea');
      temp.value = text;
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.select();

      try {
        document.execCommand('copy');
        toast.textContent = 'Copied to clipboard!';
      } catch (copyError) {
        toast.textContent = 'Please copy your value: ' + value;
      }

      temp.remove();
    }
  });

  render();
})();
</script>
</body>
</html>
